# Tests and builds the MK2 Activator on every push and pull request.
# Version tags publish only the macOS package; Windows remains an internal build artifact.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build MK2 Activator.app
        run: |
          ./build_mac_app.sh
          ditto -c -k --keepParent "dist/MK2 Activator.app" "dist/MK2.Activator.mac.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: MK2-Activator-mac
          path: dist/MK2.Activator.mac.zip

      - name: Publish macOS release
        if: startsWith(github.ref, 'refs/tags/v')
        run: shasum -a 256 dist/MK2.Activator.mac.zip > dist/SHA256-mac.txt

      - name: Attach macOS release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MK2.Activator.mac.zip
            dist/SHA256-mac.txt
          generate_release_notes: true

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build MK2 Activator.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --windowed --uac-admin --name "MK2 Activator" mk2_patcher.py

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\MK2 Activator.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MK2 Activator.exe" | Out-File dist\SHA256.txt -Encoding ascii
          Get-Content dist\SHA256.txt
          Copy-Item release\README.txt dist\README.txt

      - uses: actions/upload-artifact@v5
        with:
          name: MK2-Activator
          path: |
            dist/MK2 Activator.exe
            dist/SHA256.txt
            dist/README.txt
